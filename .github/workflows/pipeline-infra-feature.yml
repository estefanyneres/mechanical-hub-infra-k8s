name: Feature Pipeline Infra

on:
  push:
    branches: [feature/*]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

  create-pr:
    name: Criar PR para Main
    runs-on: ubuntu-latest
    needs: validate
    if: always() && needs.validate.result != 'failure'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Criar Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR ja existe para branch $BRANCH"
          else
            gh pr create \
              --title "Merge $BRANCH para main" \
              --body "PR criado automaticamente pela pipeline apos terraform fmt/init/validate passarem." \
              --base main \
              --head "$BRANCH"
            echo "PR criado com sucesso."
          fi
