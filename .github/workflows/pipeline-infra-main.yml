name: Main Pipeline Infra

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  config:
    name: Ler Configuracao
    runs-on: ubuntu-latest
    outputs:
      destroy: ${{ steps.read-config.outputs.destroy }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Ler flag de destroy
        id: read-config
        run: |
          source infra/pipeline.conf
          echo "destroy=$DESTROY" >> $GITHUB_OUTPUT

  terraform:
    name: Terraform K8s ${{ needs.config.outputs.destroy == 'true' && 'Destroy' || 'Apply' }}
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Destroy
        if: needs.config.outputs.destroy == 'true'
        working-directory: infra
        run: terraform destroy -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform Apply
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform apply -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Mostrar outputs
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform output
