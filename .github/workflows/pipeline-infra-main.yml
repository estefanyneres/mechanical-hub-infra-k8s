name: Main Pipeline Infra

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-mechanical-hub

jobs:
  config:
    name: Ler Configuracao
    runs-on: ubuntu-latest
    outputs:
      destroy: ${{ steps.read-config.outputs.destroy }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Ler flag de destroy
        id: read-config
        run: |
          source infra/pipeline.conf
          echo "destroy=$DESTROY" >> $GITHUB_OUTPUT

  terraform:
    name: Terraform K8s ${{ needs.config.outputs.destroy == 'true' && 'Destroy' || 'Apply' }}
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Terraform Destroy
        if: needs.config.outputs.destroy == 'true'
        working-directory: infra
        run: terraform destroy -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Terraform Apply
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform apply -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Mostrar outputs
        if: needs.config.outputs.destroy == 'false'
        working-directory: infra
        run: terraform output

  datadog-agent:
    name: Instalar Datadog Agent
    runs-on: ubuntu-latest
    needs: [config, terraform]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Adicionar repositorio Helm do Datadog
        run: |
          helm repo add datadog https://helm.datadoghq.com
          helm repo update

      - name: Criar namespace datadog
        run: kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar secret com a API key do Datadog
        run: |
          kubectl -n datadog create secret generic datadog-secret \
            --from-literal api-key=${{ secrets.DD_API_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Instalar ou atualizar o Datadog Agent via Helm
        run: |
          helm upgrade --install datadog-agent datadog/datadog \
            --namespace datadog \
            -f datadog/datadog-values.yaml

  cluster-autoscaler:
    name: Instalar Cluster Autoscaler
    runs-on: ubuntu-latest
    needs: [config, terraform]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Adicionar repositorio Helm do Cluster Autoscaler
        run: |
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo update

      - name: Instalar ou atualizar o Cluster Autoscaler via Helm
        run: |
          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
            --namespace kube-system \
            -f cluster-autoscaler/values.yaml

  ebs-csi-driver:
    name: Instalar EBS CSI Driver
    runs-on: ubuntu-latest
    needs: [config, terraform]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Adicionar repositorio Helm do EBS CSI Driver
        run: |
          helm repo add aws-ebs-csi-driver https://kubernetes-sigs.github.io/aws-ebs-csi-driver
          helm repo update

      - name: Instalar ou atualizar o EBS CSI Driver via Helm
        run: |
          helm upgrade --install aws-ebs-csi-driver aws-ebs-csi-driver/aws-ebs-csi-driver \
            --namespace kube-system \
            --set controller.serviceAccount.create=true \
            --set node.serviceAccount.create=true

      - name: Definir StorageClass gp2 como padrao
        run: |
          kubectl patch storageclass gp2 -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'

  rabbitmq:
    name: Instalar RabbitMQ
    runs-on: ubuntu-latest
    needs: [config, terraform, ebs-csi-driver]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Criar namespace rabbitmq
        run: kubectl create namespace rabbitmq --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar secret com usuario/senha e erlang cookie do RabbitMQ
        run: |
          kubectl -n rabbitmq create secret generic rabbitmq-secret \
            --from-literal password=${{ secrets.RABBITMQ_PASSWORD }} \
            --from-literal erlang-cookie=${{ secrets.RABBITMQ_ERLANG_COOKIE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Instalar ou atualizar o RabbitMQ via Helm
        run: |
          helm upgrade --install rabbitmq oci://registry-1.docker.io/bitnamicharts/rabbitmq \
            --namespace rabbitmq \
            -f rabbitmq/values.yaml

  sonarqube:
    name: Instalar SonarQube
    runs-on: ubuntu-latest
    needs: [config, terraform, ebs-csi-driver]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Instalar Helm
        uses: azure/setup-helm@v4

      - name: Adicionar repositorio Helm do SonarQube
        run: |
          helm repo add sonarqube https://SonarSource.github.io/helm-chart-sonarqube
          helm repo update

      - name: Criar namespace sonarqube
        run: kubectl create namespace sonarqube --dry-run=client -o yaml | kubectl apply -f -

      - name: Criar secret com o passcode de monitoramento do SonarQube
        run: |
          kubectl -n sonarqube create secret generic sonarqube-secret \
            --from-literal passcode=${{ secrets.SONAR_MONITORING_PASSCODE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Instalar ou atualizar o SonarQube via Helm
        run: |
          helm upgrade --install sonarqube sonarqube/sonarqube \
            --namespace sonarqube \
            -f sonarqube/values.yaml

  sonarqube-bootstrap:
    name: Gerar token do SonarQube pos-subida
    runs-on: ubuntu-latest
    needs: [config, terraform, sonarqube]
    if: needs.config.outputs.destroy == 'false'
    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      # Nao reconfigura Quality Gate: o gate padrao "Sonar way" (ja vem pronto
      # em qualquer banco H2 novo) ja exige 80% de cobertura no codigo novo,
      # que foi a opcao escolhida (mais facil de cumprir que cobertura geral,
      # e evita criar/manter um gate customizado via API).
      - name: Abrir port-forward pro SonarQube e aguardar ficar pronto
        run: |
          kubectl -n sonarqube port-forward svc/sonarqube-sonarqube 9000:9000 &
          echo $! > /tmp/port-forward.pid

          for i in $(seq 1 60); do
            STATUS=$(curl -s http://localhost:9000/sonarqube/api/system/status | jq -r '.status' 2>/dev/null || echo "")
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube esta UP."
              exit 0
            fi
            echo "Aguardando SonarQube subir... ($i/60)"
            sleep 10
          done
          echo "SonarQube nao ficou UP a tempo."
          exit 1

      - name: Gerar novo token de autenticacao (login padrao admin/admin)
        run: |
          TOKEN_NAME="ci-token-$(date +%s)"
          RESPONSE=$(curl -s -u admin:admin -X POST \
            "http://localhost:9000/sonarqube/api/user_tokens/generate" \
            -d "name=${TOKEN_NAME}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Falha ao gerar o token: $RESPONSE"
            exit 1
          fi

          {
            echo "## Token do SonarQube gerado nesta sessao"
            echo ""
            echo "Copie este valor manualmente para o secret \`SONAR_TOKEN\` nos 4"
            echo "repositorios de microsservico (core-service, repair-service,"
            echo "stock-service, billing-service):"
            echo ""
            echo '```'
            echo "$TOKEN"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encerrar o port-forward
        if: always()
        run: kill "$(cat /tmp/port-forward.pid)" 2>/dev/null || true
