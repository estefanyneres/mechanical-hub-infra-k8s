datadog:
  site: "datadoghq.com"
  clusterName: "eks-mechanical-hub"
  apiKeyExistingSecret: "datadog-secret"
  clusterChecks:
    enabled: true
  orchestratorExplorer:
    enabled: true
  tags:
    - "env:prod"
  apm:
    portEnabled: true
  dogstatsd:
    useHostPort: true
    nonLocalTraffic: true
  logs:
    enabled: true
    containerCollectAll: true
  containerExcludeLogs: "kube_namespace:datadog kube_namespace:kube-system"
agents:
  containers:
    traceAgent:
      env:
        - name: DD_APM_IGNORE_RESOURCES
          value: "GET /actuator/health"
registry: "public.ecr.aws/datadog"
