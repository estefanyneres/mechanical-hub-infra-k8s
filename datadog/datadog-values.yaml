datadog:
  site: "datadoghq.com"
  clusterName: "eks-mechanical-hub"
  apiKeyExistingSecret: "datadog-secret"
  clusterChecks:
    enabled: true
  orchestratorExplorer:
    enabled: true
  tags:
    - "env:prod"
  apm:
    portEnabled: true
  dogstatsd:
    useHostPort: true
    nonLocalTraffic: true
  logs:
    enabled: true
    containerCollectAll: true
registry: "public.ecr.aws/datadog"
