image:
  repository: bitnamilegacy/rabbitmq

auth:
  username: mechanical-hub
  existingPasswordSecret: rabbitmq-secret
  existingSecretPasswordKey: password
  existingErlangSecret: rabbitmq-secret
  existingSecretErlangKey: erlang-cookie

persistence:
  enabled: true
  size: 2Gi

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/rabbitmq-exporter

# As filas, exchanges e bindings NAO sao provisionados aqui.
# Cada microsservico declara o que precisa (exchange/fila/binding durave)
